name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Code quality checks
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: react-app/package-lock.json
    
    - name: Install dependencies
      working-directory: ./react-app
      run: npm ci
    
    - name: Run linter
      working-directory: ./react-app
      run: npm run lint
    
    - name: Test build
      working-directory: ./react-app
      run: npm run build
    
    - name: Check bundle size
      working-directory: ./react-app
      run: |
        echo "Bundle size check:"
        du -sh dist/
        
        # Check if bundle is reasonable size (< 5MB)
        size=$(du -s dist/ | cut -f1)
        if [ $size -gt 5120 ]; then
          echo "⚠️  WARNING: Bundle size is quite large (>5MB)"
        else
          echo "✅ Bundle size looks reasonable"
        fi

  # Security checks
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: react-app/package-lock.json
    
    - name: Install dependencies
      working-directory: ./react-app
      run: npm ci
    
    # Fails the check on a high or critical advisory in what ships to users.
    - name: Audit production dependencies
      working-directory: ./react-app
      run: npm audit --omit=dev --audit-level=high

    # Informational: build and test tooling never reaches users.
    - name: Report dev dependency advisories
      working-directory: ./react-app
      run: npm audit --audit-level=moderate || true